<!DOCTYPE html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>টেসলাবন্ধু অ্যাডমিন</title><meta name="robots" content="noindex"><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/style.css">
<style>main{max-width:900px}table{width:100%;border-collapse:collapse;font-size:14px}td,th{border-bottom:1px solid var(--road);padding:6px;text-align:left;vertical-align:top}.wrap{overflow-x:auto}.stat{flex:1 1 110px;text-align:center}.stat b{font-size:28px;display:block}button{padding:6px 12px;font-size:14px}</style></head><body><main>
<div class="hood"></div><h1>🛠️ অ্যাডমিন</h1><div id="login" class="art"><label>ADMIN_KEY</label><input id="key" type="password"><p class="err" id="err"></p><button onclick="enter()">প্রবেশ</button></div>
<div id="panel" class="hide"><div class="row" id="tabs"><button onclick="show('stats')">পরিসংখ্যান</button><button class="alt" onclick="show('reports')">রিপোর্ট</button><button class="alt" onclick="show('users')">ইউজার</button><button class="alt" onclick="show('matches')">ম্যাচ</button><button class="alt" onclick="out()">বের হন</button></div><div class="art" id="out"></div></div>
</main><script>
const $=i=>document.getElementById(i),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let key=sessionStorage.getItem('tb_admin')||'';
async function call(m,p){const r=await fetch('/api/admin/'+p,{method:m,headers:{'x-admin-key':key,'Content-Type':'application/json'},body:m==='POST'?JSON.stringify(arguments[2]||{}):undefined});const j=await r.json();if(!r.ok)throw new Error(j.error);return j}
async function enter(){key=$('key').value;try{await call('GET','stats');sessionStorage.setItem('tb_admin',key);$('login').classList.add('hide');$('panel').classList.remove('hide');show('stats')}catch(e){$('err').textContent='ভুল কী বা অ্যাডমিন বন্ধ আছে'}}
function out(){sessionStorage.removeItem('tb_admin');location.reload()}
const D=t=>new Date(t).toLocaleString('bn-BD');
async function show(w){const o=$('out');o.textContent='লোড হচ্ছে…';try{const d=await call('GET',w);
 if(w==='stats'){const L={users:'ইউজার',requests:'অনুরোধ',matches:'ম্যাচ',active:'সক্রিয়',done:'সম্পন্ন',openReports:'খোলা রিপোর্ট'};o.innerHTML='<div class="row">'+Object.entries(d).map(([k,v])=>`<div class="stat"><b>${v}</b>${L[k]}</div>`).join('')+'</div>'}
 if(w==='reports')o.innerHTML=`<div class="wrap"><table><tr><th>#</th><th>ম্যাচ</th><th>রিপোর্টার</th><th>কারণ</th><th>অবস্থা</th><th></th></tr>${d.map(r=>`<tr><td>${r.id}</td><td>${r.match_id}</td><td>${esc(r.reporter_name)}<br>${esc(r.reporter_phone)}</td><td>${esc(r.reason)}<br><span class="small">${D(r.created)}</span></td><td>${r.status}</td><td>${r.status==='open'?`<button onclick="act('reports/${r.id}/resolve','reports')">সমাধান</button>`:''}</td></tr>`).join('')||'<tr><td>কিছু নেই</td></tr>'}</table></div>`;
 if(w==='users')o.innerHTML=`<div class="wrap"><table><tr><th>#</th><th>নাম</th><th>ফোন</th><th>যাচাই</th><th></th></tr>${d.map(u=>`<tr><td>${u.id}</td><td>${esc(u.name)}</td><td>${esc(u.phone)}</td><td>${u.verified?'✔':'✖'}</td><td><button class="${u.banned?'go':'red'}" onclick="act('users/${u.id}/ban','users',{banned:${u.banned?0:1}})">${u.banned?'আনব্যান':'ব্যান'}</button></td></tr>`).join('')}</table></div>`;
 if(w==='matches')o.innerHTML=`<div class="wrap"><table><tr><th>#</th><th>A</th><th>B</th><th>অবস্থা</th><th>স্কোর</th><th>ভাড়া</th></tr>${d.map(m=>`<tr><td>${m.id}</td><td>${m.user_a}</td><td>${m.user_b}</td><td>${m.status}</td><td>${m.score}%</td><td>৳${m.fare}</td></tr>`).join('')}</table></div>`}catch(e){o.textContent=e.message}}
async function act(p,w,b){await call('POST',p,b);show(w)}
if(key){$('key').value=key;enter()}
</script></body></html>
